[project]
name = "ptzcalib"
version = "0.1.0"
description = "Python re-implementation of PTZ-Calib (ICRA 2025)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "opencv-python-headless==4.10.0.84",
    "shapely>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ptzcalib"]
